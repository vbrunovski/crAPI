rules:
  - id: java-command-injection
    languages: [java]
    message: "КРИТИЧЕСКАЯ УЯЗВИМОСТЬ: Обнаружен вызов выполнения системных команд через Runtime.exec(). Это может привести к удаленному выполнению кода (RCE), если аргументы контролируются пользователем."
    severity: ERROR
    patterns:
      - pattern: Runtime.getRuntime().exec(...)